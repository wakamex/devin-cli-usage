[project]
name = "devin-cli-usage"
version = "0.1.0"
description = "Devin CLI account quota monitor using local Devin authentication"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devin_cli_usage"]

[project.urls]
Homepage = "https://github.com/wakamex/devin-cli-usage"
Source = "https://github.com/wakamex/devin-cli-usage"

[project.scripts]
devin-cli-usage = "devin_cli_usage:main"
